<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; color: #222; }
        h2 { border-bottom: 1px solid #ccc; padding-bottom: 6px; }
        .highlight { background: #f8f8f8; border: 1px solid #ddd; padding: 12px; font-family: monospace; }
        .pre-wrap { white-space: pre-wrap; background: #f5f5f5; padding: 10px; border-left: 4px solid #bbb; font-family: monospace; }
    </style>
</head>
<body>
    <h1 style="text-align:center">Lab Record</h1>

    <h2>Aim</h2>
    <p>{{ aim }}</p>

    <h2>Algorithm / Theory</h2>
    <p class="pre-wrap">{{ algorithm }}</p>

    <h2>Source Code</h2>
    {{ code }}

    <h2>Output</h2>
    <p class="pre-wrap">{{ output }}</p>

    <h2>Result &amp; Learning</h2>
    <p>{{ result }}</p>
</body>
</html>
