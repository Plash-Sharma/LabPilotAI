name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          docker build -t $ECR_REGISTRY/labpilotai-backend:$GITHUB_SHA ./backend
          docker push $ECR_REGISTRY/labpilotai-backend:$GITHUB_SHA
      - name: Deploy to ECS / update EC2 via SSM
        run: ./infra/scripts/deploy.sh $GITHUB_SHA
