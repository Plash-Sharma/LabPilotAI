name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install System Dependencies (WeasyPrint / Cairo / Pango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libjpeg-dev \
            libopenjp2-7-dev \
            libffi-dev \
            fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check backend/

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///preview.db
          SECRET_KEY: ci-testing-secret-key-do-not-use-in-production
          GEMINI_API_KEY: ci-dummy-gemini-key
          USE_CELERY: "false"
        run: |
          cd backend
          pytest tests/unit -v -o addopts=""

  frontend-test:
    name: Frontend (Typecheck & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: npm ci --prefix frontend

      - name: Build Frontend (Vite + TypeScript)
        run: npm run build --prefix frontend

  docker-verification:
    name: Docker Build Verification
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: labpilotai-backend:test
